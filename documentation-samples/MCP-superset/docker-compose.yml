# StarRocks shared-data quick start (1 FE + 1 CN + MinIO) plus Apache Superset and the
# Superset MCP service. Derived from
# https://github.com/StarRocks/demo/blob/master/documentation-samples/MCP/docker-compose.yml (Apache-2.0)
#
# Two laptop/Docker patches carried over from the MCP demo:
#   - AWS_EC2_METADATA_DISABLED=true on starrocks-cn, without which the CN's AWS SDK hangs
#     probing the EC2 metadata service on first S3 access and every CREATE TABLE times out.
#   - Stream Load is posted to the CN (8040) rather than the FE, avoiding a hostname redirect.
#
# Superset additions:
#   - superset-db (Postgres) holds Superset's own metadata. Superset's charts/dashboards live
#     here; the *analytics* data stays in StarRocks/MinIO.
#   - superset      serves the UI on 8088.
#   - superset-mcp  serves the MCP service (streamable HTTP) on 5008 from the same image and
#     the same metadata database, so anything Claude builds shows up in the UI immediately.
services:
  minio:
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    image: minio/minio:latest
    ports:
      - "9001:9001"
      - "9000:9000"
    entrypoint: sh
    command: '-c ''mkdir -p /minio_data/starrocks && minio server /minio_data --console-address ":9001"'''
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio_mc:
    # This service is short lived, it does this:
    # - starts up
    # - checks to see if the MinIO service `minio` is ready
    # - creates a MinIO Access Key that the StarRocks services will use
    # - creates the bucket the StarRocks storage volume writes to
    # - exits
    image: minio/mc:latest
    container_name: minio-mc
    entrypoint:
      - sh
      - -c
      - |
        until mc ls minio > /dev/null 2>&1; do
          sleep 0.5
        done

        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        mc admin user svcacct add --access-key ${MINIO_ACCESS_KEY} \
        --secret-key ${MINIO_SECRET_KEY} \
        myminio \
        miniouser
        mc mb --ignore-existing myminio/${STARROCKS_BUCKET}
    depends_on:
        minio:
          condition: service_healthy

  starrocks-fe:
    image: starrocks/fe-ubuntu:4.1-latest
    hostname: starrocks-fe
    container_name: starrocks-fe
    user: root
    command:
      - /bin/bash
      - -c
      - |
        echo "# enable the shared data run mode" >> /opt/starrocks/fe/conf/fe.conf
        echo "run_mode = shared_data" >> /opt/starrocks/fe/conf/fe.conf
        echo "cloud_native_storage_type = S3" >> /opt/starrocks/fe/conf/fe.conf

        /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN
    environment:
      - AWS_EC2_METADATA_DISABLED=true
    ports:
      - 8030:8030
      - 9020:9020
      - 9030:9030
    healthcheck:
      test: 'mysql -u root -h starrocks-fe -P 9030 -e "show frontends\G" |grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
        minio:
            condition: service_healthy
        # the storage volume needs the access key and bucket minio_mc creates
        minio_mc:
            condition: service_completed_successfully

  starrocks-cn:
    image: starrocks/cn-ubuntu:4.1-latest
    command:
      - /bin/bash
      - -c
      - |
        sleep 15s;
        ulimit -u 65535;
        ulimit -n 65535;
        mysql --connect-timeout 2 -h starrocks-fe -P9030 -uroot -e "ALTER SYSTEM ADD COMPUTE NODE \"starrocks-cn:9050\";"
        /opt/starrocks/cn/bin/start_cn.sh
    environment:
      - HOST_TYPE=FQDN
      - AWS_EC2_METADATA_DISABLED=true
    ports:
      - 8040:8040
    hostname: starrocks-cn
    container_name: starrocks-cn
    user: root
    depends_on:
      starrocks-fe:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
    healthcheck:
      test: 'mysql -u root -h starrocks-fe -P 9030 -e "SHOW COMPUTE NODES\G" |grep "Alive: true"'
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Superset metadata database. This stores dashboards, charts, and datasets --
  # not the analytics data, which stays in StarRocks.
  # ---------------------------------------------------------------------------
  superset-db:
    image: postgres:16-alpine
    container_name: superset-db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # One-shot bootstrap: migrate the metadata DB, create the admin user, and
  # register StarRocks as a Superset database connection. Exits when done.
  # ---------------------------------------------------------------------------
  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION:-6.1.0}
    image: starrocks-demo/superset:${SUPERSET_VERSION:-6.1.0}
    container_name: superset-init
    user: root
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./bootstrap_superset.sh:/app/bootstrap_superset.sh:ro
      - superset-home:/app/superset_home
    command: ["bash", "/app/bootstrap_superset.sh"]
    depends_on:
      superset-db:
        condition: service_healthy
      starrocks-cn:
        condition: service_healthy

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION:-6.1.0}
    image: starrocks-demo/superset:${SUPERSET_VERSION:-6.1.0}
    container_name: superset
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - 8088:8088
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      superset-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # The Superset MCP service (streamable HTTP on 5008). Claude Code connects to
  # this through .mcp.json.
  # ---------------------------------------------------------------------------
  superset-mcp:
    build:
      context: .
      dockerfile: Dockerfile.superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION:-6.1.0}
    image: starrocks-demo/superset:${SUPERSET_VERSION:-6.1.0}
    container_name: superset-mcp
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      # localhost only: the MCP service runs without auth (see superset_config.py)
      - 127.0.0.1:5008:5008
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    command: ["superset", "mcp", "run", "--host", "0.0.0.0", "--port", "5008"]
    healthcheck:
      # The MCP endpoint only answers POST; a GET returning 405 means it is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5008/mcp | grep -q 405"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      superset:
        condition: service_healthy

volumes:
  superset-db-data:
  superset-home:
